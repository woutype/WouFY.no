name: Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'apps.json'
      - 'scripts/**'
      - '**/*.md'

jobs:
  ipa:
    name: Build Unsigned IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 (Swift 6.2, prefer <= 26.2 for Expo SDK 58)
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_26.2*.app /Applications/Xcode_26.1*.app /Applications/Xcode_26.0*.app /Applications/Xcode_26*.app 2>/dev/null | head -n 1)
          if [ -z "$XCODE_APP" ]; then
            echo "Xcode 26 not found in /Applications:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          echo "Using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          swift --version
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --clean
      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update
      - name: Compile iOS App (Unsigned)
        run: |
          xcodebuild -workspace ios/Woufy.xcworkspace \
            -scheme Woufy \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package into IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -type d -name "*.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r woufy.ipa Payload
          rm -rf Payload
      - uses: actions/upload-artifact@v4
        with:
          name: woufy-ipa
          path: woufy.ipa
          retention-days: 14

  apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean
      - name: Assemble release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Collect APK
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$APK_PATH" woufy.apk
      - uses: actions/upload-artifact@v4
        with:
          name: woufy-apk
          path: woufy.apk
          retention-days: 14
