name: Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'apps.json'
      - 'scripts/**'
      - '**/*.md'

jobs:
  ipa:
    name: Build Unsigned IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 (Swift 6.2, prefer <= 26.2 for Expo SDK 58)
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_26.2*.app /Applications/Xcode_26.1*.app /Applications/Xcode_26.0*.app /Applications/Xcode_26*.app 2>/dev/null | head -n 1)
          if [ -z "$XCODE_APP" ]; then
            echo "Xcode 26 not found in /Applications:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          echo "Using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          swift --version
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Patch ExpoModulesJSI for Swift 6.2 concurrency
        run: |
          node -e '
            const fs = require("fs");
            const p = "node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI/Runtime/Values/JavaScriptObject.swift";
            const s = fs.readFileSync(p, "utf8");
            const target = "    nonisolated(unsafe) let slot = buffer.baseAddress!\n    expo.emplaceUndefined(slot)\n    defer {\n      expo.destroyValues(slot, 1)\n    }\n    // The runtime can'\''t be deallocated during a call on its JavaScript thread, so it'\''s borrowed without\n    // a retain.\n    try runtime._withUnsafeGuaranteedRef { runtime in\n      try JavaScriptActor.assumeIsolated {\n        try encode(JavaScriptValue.Slot(slot), runtime)\n      }\n    }";
            const repl = "    nonisolated(unsafe) let slot = buffer.baseAddress!\n    let slotAddress = UInt(bitPattern: slot)\n    expo.emplaceUndefined(slot)\n    defer {\n      expo.destroyValues(slot, 1)\n    }\n    // The runtime can'\''t be deallocated during a call on its JavaScript thread, so it'\''s borrowed without\n    // a retain.\n    try runtime._withUnsafeGuaranteedRef { runtime in\n      try JavaScriptActor.assumeIsolated {\n        let innerSlot = UnsafeMutablePointer<facebook.jsi.Value>(bitPattern: slotAddress)!\n        try encode(JavaScriptValue.Slot(innerSlot), runtime)\n      }\n    }";
            if (!s.includes(target)) throw new Error("Target snippet not found in JavaScriptObject.swift");
            fs.writeFileSync(p, s.replace(target, repl));
            console.log("Patched JavaScriptObject.swift successfully");
          '
      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --clean
      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update
      - name: Compile iOS App (Unsigned)
        run: |
          xcodebuild -workspace ios/Woufy.xcworkspace \
            -scheme Woufy \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package into IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -type d -name "*.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r woufy.ipa Payload
          rm -rf Payload
      - uses: actions/upload-artifact@v4
        with:
          name: woufy-ipa
          path: woufy.ipa
          retention-days: 14

  apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean
      - name: Cache Gradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/build.gradle*', 'android/**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Assemble release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Collect APK
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$APK_PATH" woufy.apk
      - uses: actions/upload-artifact@v4
        with:
          name: woufy-apk
          path: woufy.apk
          retention-days: 14
